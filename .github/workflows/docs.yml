name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish development documentation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: cargo install usage-cli --version 6.11.1 --locked
      - run: cargo build --locked && bash scripts/generate-docs.sh
      - run: npm ci && npm run docs:build
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deploy
