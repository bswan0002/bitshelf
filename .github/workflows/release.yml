name: Release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching Cargo and changelog
        required: true
      publish:
        description: Publish verified artifacts (requires release environment approval)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - name: Require dispatch from main or the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main | "refs/tags/$RELEASE_TAG") ;;
            *) echo "::error::Dispatch from main or refs/tags/$RELEASE_TAG, not $GITHUB_REF"; exit 1 ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]; then
            echo "::error::refs/tags/$RELEASE_TAG must be an annotated tag"; exit 1
          fi
          sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$sha"
          python3 scripts/release.py preflight --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --commit "$sha" > release-info.json
          python3 -c 'import json,os; v=json.load(open("release-info.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("prerelease="+str(v["prerelease"]).lower()+"\n")'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned $RELEASE_TAG to $sha" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked
      - run: python3 -B scripts/test_release.py
      - run: python3 -B scripts/test_formula.py
      - run: python3 -B scripts/test_tap.py
      - run: python3 scripts/notices.py --check
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo install usage-cli --version 6.11.1 --locked
      - run: bash scripts/generate-docs.sh
        env:
          BS: target/${{ matrix.target }}/release/bs
      - name: Package and validate
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python3 scripts/package.py --tag "$RELEASE_TAG" --target "$TARGET" --binary "target/$TARGET/release/bs" --output-dir archives
          python3 scripts/smoke-package.py "archives/bitshelf-$RELEASE_TAG-$TARGET.tar.gz" --tag "$RELEASE_TAG" --target "$TARGET" --commit "$RELEASE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: archives/*.tar.gz
          if-no-files-found: error
  verify:
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: archives
          merge-multiple: true
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          (cd archives && sha256sum -- *.tar.gz > SHA256SUMS)
          python3 scripts/release.py verify-artifacts --tag "$RELEASE_TAG" --directory archives --commit "$RELEASE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release
          path: archives/
          if-no-files-found: error
  packages:
    needs: [preflight, verify]
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release
          path: archives
      - name: Test actual archives and formula
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          python3 scripts/smoke-package.py "archives/bitshelf-$RELEASE_TAG-$TARGET.tar.gz" --tag "$RELEASE_TAG" --target "$TARGET" --commit "$RELEASE_SHA"
          case "$RELEASE_TAG" in
            *-*) echo "Prerelease archive verified; stable Homebrew formula intentionally excluded" ;;
            *) python3 scripts/homebrew-formula.py "$RELEASE_TAG" archives/SHA256SUMS --base-url "file://$PWD/archives" > bitshelf.rb
               python3 scripts/test-homebrew.py bitshelf.rb ;;
          esac
  docs:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: cargo install usage-cli --version 6.11.1 --locked
      - run: cargo build --locked && bash scripts/generate-docs.sh
      - name: Require committed generated reference docs
        run: test -z "$(git status --porcelain -- docs/reference)" || { git status --porcelain -- docs/reference; exit 1; }
      - run: python3 scripts/check-doc-links.py
      - run: npm ci && npm run docs:build
  publish:
    if: ${{ inputs.publish }}
    needs: [preflight, verify, packages, docs]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release
          path: archives
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --directory archives --commit "$RELEASE_SHA"
