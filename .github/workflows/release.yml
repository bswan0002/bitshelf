name: Release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching Cargo and changelog
        required: true
      publish:
        description: Publish verified artifacts (requires release environment approval)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          python3 scripts/release.py preflight --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > release-info.json
          python3 -c 'import json,os; v=json.load(open("release-info.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("prerelease="+str(v["prerelease"]).lower()+"\n")'
  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked
      - run: python3 -B scripts/test_release.py
      - run: python3 scripts/notices.py --check
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo install usage-cli --version 6.11.1 --locked
      - run: bash scripts/generate-docs.sh
        env:
          BS: target/${{ matrix.target }}/release/bs
      - name: Package and validate
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release.py validate --tag "$RELEASE_TAG" --binary "target/$TARGET/release/bs"
          mkdir -p staging archives
          cp "target/$TARGET/release/bs" dist/bs.1 LICENSE README.md THIRD_PARTY_NOTICES.txt staging/
          cp licenses/inventory.json staging/DEPENDENCIES.json
          cp -R dist/completions skills staging/
          python3 scripts/build-info.py "$TARGET" > staging/BUILD-INFO.json
          tar -czf "archives/bitshelf-$RELEASE_TAG-$TARGET.tar.gz" -C staging .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: archives/*.tar.gz
          if-no-files-found: error
  verify:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: archives
          merge-multiple: true
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          (cd archives && sha256sum *.tar.gz > SHA256SUMS)
          python3 scripts/release.py verify-artifacts --tag "$RELEASE_TAG" --directory archives
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release
          path: archives/
          if-no-files-found: error
  publish:
    if: ${{ inputs.publish }}
    needs: [preflight, verify]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release
          path: archives
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --directory archives
