name: Release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching Cargo and changelog
        required: true
      publish:
        description: Publish verified artifacts (requires release environment approval)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          python3 scripts/release.py preflight --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > release-info.json
          python3 -c 'import json,os; v=json.load(open("release-info.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("prerelease="+str(v["prerelease"]).lower()+"\n")'
  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked
      - run: python3 -B scripts/test_release.py
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo install usage-cli --version 6.11.1 --locked
      - run: bash scripts/generate-docs.sh
        env:
          BS: target/${{ matrix.target }}/release/bs
      - name: Package and validate
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release.py validate --tag "$RELEASE_TAG" --binary "target/$TARGET/release/bs"
          mkdir -p staging archives
          cp "target/$TARGET/release/bs" dist/bs.1 LICENSE README.md staging/
          cp -R dist/completions skills staging/
          tar -czf "archives/bitshelf-$RELEASE_TAG-$TARGET.tar.gz" -C staging .
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: archives/*.tar.gz
          if-no-files-found: error
  verify:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: archives
          merge-multiple: true
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          (cd archives && sha256sum *.tar.gz > SHA256SUMS)
          python3 scripts/release.py verify-artifacts --tag "$RELEASE_TAG" --directory archives
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: archives/
          if-no-files-found: error
  publish:
    if: ${{ inputs.publish }}
    needs: [preflight, verify]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: archives
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --directory archives
