[package]
name = "bitshelf"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A local Markdown-first shelf for reusable bits"
repository = "https://github.com/bswan0002/bitshelf"

[[bin]]
name = "bs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
demand = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1"
tempfile = "3"
toml = "0.9"
usage = { package = "usage-rs", version = "6.11", features = ["completions"] }

[patch.crates-io]
demand = { path = "vendor/demand" }

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"
